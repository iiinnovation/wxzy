name: wxzy

x-api-common: &api-common
  image: ${WXZY_API_IMAGE:-wxzy-api:latest}
  build:
    context: ../../server
  env_file:
    - .env.production
  environment:
    APP_ENV: production
    AUTH_MODE: wechat
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wxzy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wxzy}
    CORS_ORIGINS: https://servicewechat.com,https://localhost
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wxzy}
      POSTGRES_USER: ${POSTGRES_USER:-wxzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    <<: *api-common
    restart: unless-stopped
    networks:
      - backend
      - edge
    ports:
      - 127.0.0.1:${WXZY_API_HOST_PORT:-18000}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *api-common
    profiles: ["tools"]
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]

  import-publication:
    <<: *api-common
    profiles: ["tools"]
    command: ["python", "-m", "scripts.import_publication", "/publication"]
    volumes:
      - ../../data/document-pipeline/publications/pub-first-batch-p5t10-v1:/publication:ro

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge:
